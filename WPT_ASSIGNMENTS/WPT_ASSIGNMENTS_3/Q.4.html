<!DOCTYPE html>
<html>
<body>

<p onmouseover="highlight()" onmouseout="removeHighlight()">
<b>We</b> have just started <b>this</b>  section for the users 
 (<b>beginner</b> to intermediate) who <b>want</b> to work 
with <b>various</b> JavaScript <b>problems</b> and write scripts online though
<b>test</b> therir javascript <b>skill</b>
</p>

<script>
function highlight() {
    let bold = document.getElementsByTagName("b");
 
    for (let i = 0; i < bold.length; i++) {
        bold[i].style.color = "green";
    }
   
}

function removeHighlight() {
    let bold = document.getElementsByTagName("b");
    for (let i = 0; i < bold.length; i++) {
        bold[i].style.color = "black";
    }
}
</script>

</body>
</html>
