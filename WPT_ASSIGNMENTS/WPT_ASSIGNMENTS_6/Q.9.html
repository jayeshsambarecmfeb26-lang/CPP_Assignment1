<body>
    <script>

// Create a function that takes any number of arguments and 
// returns their sum using the rest operator.

function sum(...numbers) 
{
    return numbers.reduce((total, num) => total + num, 0);
}

console.log(sum(1, 2, 3, 4));

    </script>
