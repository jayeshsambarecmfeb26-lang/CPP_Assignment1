<!DOCTYPE html>

<body>
    <!-- Use the filter method 
    to create a new array containing only the even numbers
from the given array.  -->
<script>
    const n = [1, 2, 3, 4, 5, 6];

const evenNum = n.filter(n => n % 2 === 0);

console.log(evenNum);
</script>
</body>
