<body>
    <!-- Write a function that accepts a callback and 
    executes it after a delay. -->

    <script>

        function delayedExecution(callback) 
        {
    setTimeout(() => {
        callback();
    }, 2000);
}

delayedExecution(() => console.log("Executed after delay"));
    </script>
</body>
