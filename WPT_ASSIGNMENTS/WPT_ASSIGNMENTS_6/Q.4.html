 <!-- 4. Question: Given an object representing a car,
use object destructuring to extract its properties. -->
<script>

    const car =
     {
    brand: "MAHINDRA",
    model: "SCORPIO",
    year: 2020
};

const { brand, model, year } = car;

console.log(brand, model, year);


</script>
