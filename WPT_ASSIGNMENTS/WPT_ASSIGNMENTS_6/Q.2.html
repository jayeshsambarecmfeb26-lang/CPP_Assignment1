    <!-- 2. Question: Write a function to calculate
      the area of a rectangle using both a regular
function and an arrow function. -->
<script>

function areaRectangle(length, width) 
{
    return length * width;
}

const areaRectArrow = (length, width) => length * width;

console.log(areaRectangle(30, 60));
console.log(areaRectArrow(20, 40));

</script>
