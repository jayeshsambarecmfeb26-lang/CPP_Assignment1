<!-- Exercise 4: 
Modify fetchData from Exercise 3 to include error handling. 
Requirements: 
●  Call the callback with an error message if an error occurs; otherwise, pass 
the “response.” 
●  Handle the error gracefully by logging it if it occurs. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fetchData(url, callback) 
        {
    console.log("Fetching data from:", url);

    setTimeout(() => {
        let isError = false; 

        if (isError) {
            callback("Error: Failed to fetch data", null);
        } else
         {
            let response = "Response from " + url;
            callback(null, response);
        }
    }, 2000);
}

fetchData("https://google.com", function(error, response)
 {
    if (error) 
    {
        console.log(error); 
    } else {
        console.log(response);
    }
});
    </script>
    
</body>
</html>
