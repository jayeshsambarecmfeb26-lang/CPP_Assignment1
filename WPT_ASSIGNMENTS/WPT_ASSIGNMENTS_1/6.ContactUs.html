<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="ContactCss.css">
</head>
<body>

    <div class="contact-container">
        <div class="sidebar">
            <h2>Get in touch</h2>
            
            <div class="info-item">
                <p><strong>Name</strong></p>
                <p>HTML CSS Tutorials</p>
            </div>

            <div class="info-item">
                <p><strong>Email</strong></p>
                <p>htmlcss3tutorials@gmail.com</p>
            </div>

            <div class="info-item">
                <p><strong>Phone</strong></p>
                <p>+91 1234567890</p>
            </div>

            <div class="info-item">
                <p><strong>Address</strong></p>
                <p>123 Street, Bangalore, India, 500001</p>
            </div>

            <div class="social-icons">
                <span>f</span> <span>t</span> <span>i</span> <span>y</span>
            </div>
        </div>

        <div class="form-area">
            <h1>Contact Us</h1>
            <form>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" value="HTMLCSS Tutorials">
                </div>

                <div class="input-group">
                    <label>Email ID</label>
                    <input type="email" value="hhhh@">
                </div>

                <div class="input-group">
                    <label>Website</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Contact Number</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Message</label>
                    <textarea rows="2"></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

</body>
</html>
