<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #d1e8e2,pink);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            display: flex;
            width: 800px;
            height: 500px;
            background-color: #fff;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        /* Left Section: Sign In */
        .signin-section {
            flex: 1.2;
            padding: 70px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .signin-section h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        .social-icons {
            margin-bottom: 40px;
        }

        .social-icons a {
            border: 1px solid #ccc;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            color: #333;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background-color: #f0f0f0;
        }

        .signin-section p {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 20px;
        }

        .input-group {
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 20px;
            background-color: #eee;
            border: none;
            border-radius: 25px;
            outline: none;
        }

        .forgot-password {
            font-size: 0.8rem;
            color: #666;
            text-decoration: none;
            margin: 10px 0 20px;
        }

        .btn-signin {
            background-color: #008ebc;
            color:blue;
            padding: 12px 45px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-signin:hover {
            background-color: #006f94;
        }

        /* Right Section: Sign Up Overlay */
        .signup-section {
            flex: 1;
            background-color: #00a0d1;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            text-align: center;
        }

        .signup-section h2 {
            font-size: 2.2rem;
            margin-bottom: 3px;
            line-height: 1.2;
        }

        .signup-section p {
            font-size: 0.9rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn-outline-signup {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 40px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-outline-signup:hover {
            background: white;
            color: #00a0d1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="signin-section">
        <h1>Sign in</h1>
        <div class="social-icons">
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fas fa-basketball-ball"></i></a>
            <a href="#"><i class="fab fa-google"></i></a>
        </div>
        <p>Or sign in using E-Mail Address</p>
        
        <div class="input-group">
            <input type="email" placeholder="Email">
        </div>
        <div class="input-group">
            <input type="password" placeholder="Password">
        </div>
        
        <a href="#" class="forgot-password">Forgot your password?</a>
        
        <button class="btn-signin">Sign In</button>
    </div>

    <div class="signup-section">
        <h2>Create Account!</h2>
        <p>Sign up if you still don't have an account ...</p>
        <button class="btn-outline-signup">Sign Up</button>
    </div>
</div>

</body>
</html>
